<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping zoom blocks users who need to magnify. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Akshay S — Full-Stack &amp; Systems Engineer</title>
    <meta
      name="description"
      content="Akshay S builds distributed web platforms, GraphRAG retrieval systems and deterministic data extraction pipelines. Case studies in applied AI, full-stack architecture and data engineering."
    />
    <meta name="author" content="Akshay S" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="canonical" href="https://portfolio-by-akshay.vercel.app/" />

    <!--
      LCP hint. Starts the portrait fetch during HTML parse instead of waiting
      for React to mount. Browsers without WebP support skip it on the type.
    -->
    <link
      rel="preload"
      as="image"
      href="/profile.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akshay S — Full-Stack &amp; Systems Engineer" />
    <meta
      property="og:description"
      content="Distributed web platforms, GraphRAG intelligence systems and deterministic extraction pipelines."
    />
    <meta property="og:url" content="https://portfolio-by-akshay.vercel.app/" />
    <meta property="og:image" content="https://portfolio-by-akshay.vercel.app/profile.png" />
    <meta property="og:image:alt" content="Portrait of Akshay S" />
    <meta name="twitter:card" content="summary" />

    <!--
      Two families, not twenty-five. The previous document requested 25 Google
      Font families in one render-blocking stylesheet; only Inter was ever used.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Akshay S",
        "jobTitle": "Full-Stack & Systems Engineer",
        "email": "mailto:akkies445@gmail.com",
        "url": "https://portfolio-by-akshay.vercel.app/",
        "sameAs": [
          "https://github.com/Akki-333",
          "https://www.linkedin.com/in/ak445"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Bannari Amman Institute of Technology"
        },
        "knowsAbout": [
          "GraphRAG",
          "Distributed Systems",
          "FastAPI",
          "React",
          "Data Engineering"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
