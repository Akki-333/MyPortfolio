<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A restaurant floor plan with one table selected, beside a pre-arrival order card showing live nutritional totals">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/><stop offset="55%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sd-bg)"/>

  <!-- Floor plan -->
  <rect x="44" y="44" width="440" height="362" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <g stroke="#ffedd5" stroke-width="1.5">
    <path d="M44 154h440M44 264h440M174 44v362M334 44v362"/>
  </g>

  <!-- booked tables (solid) / free tables (outline) / the one being chosen (amber ring) -->
  <g>
    <circle cx="109" cy="99" r="27" fill="#d97706"/><circle cx="109" cy="99" r="9" fill="#ffffff" opacity="0.55"/>
    <rect x="227" y="72" width="54" height="54" rx="11" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
    <circle cx="389" cy="99" r="27" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>

    <rect x="82" y="182" width="54" height="54" rx="11" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
    <circle cx="254" cy="209" r="27" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
    <rect x="362" y="182" width="54" height="54" rx="11" fill="#d97706"/><rect x="381" y="201" width="16" height="16" rx="4" fill="#ffffff" opacity="0.55"/>

    <!-- selection -->
    <circle cx="109" cy="319" r="35" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="109" cy="319" r="27" fill="#e11d48"/>
    <path d="M101 319 l6 6 l11 -13" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="227" y="292" width="54" height="54" rx="11" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
    <circle cx="389" cy="319" r="27" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  </g>
  <g fill="#fef3c7">
    <rect x="66" y="372" width="120" height="20" rx="10"/>
    <rect x="200" y="372" width="96" height="20" rx="10"/>
    <rect x="310" y="372" width="140" height="20" rx="10"/>
  </g>

  <!-- Order panel -->
  <g>
    <rect x="516" y="44" width="240" height="362" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="540" y="72" width="96" height="10" rx="5" fill="#0f172a"/>
    <rect x="540" y="94" width="150" height="8" rx="4" fill="#94a3b8"/>

    <!-- menu lines with price bars -->
    <g>
      <rect x="540" y="124" width="192" height="46" rx="10" fill="#fffbeb" stroke="#fed7aa" stroke-width="1.5"/>
      <circle cx="562" cy="147" r="11" fill="#f59e0b"/>
      <rect x="582" y="138" width="82" height="7" rx="3.5" fill="#334155"/><rect x="582" y="152" width="48" height="6" rx="3" fill="#94a3b8"/>
      <rect x="696" y="143" width="20" height="8" rx="4" fill="#d97706"/>

      <rect x="540" y="180" width="192" height="46" rx="10" fill="#fffbeb" stroke="#fed7aa" stroke-width="1.5"/>
      <circle cx="562" cy="203" r="11" fill="#e11d48"/>
      <rect x="582" y="194" width="64" height="7" rx="3.5" fill="#334155"/><rect x="582" y="208" width="74" height="6" rx="3" fill="#94a3b8"/>
      <rect x="700" y="199" width="16" height="8" rx="4" fill="#d97706"/>

      <rect x="540" y="236" width="192" height="46" rx="10" fill="#fffbeb" stroke="#fed7aa" stroke-width="1.5"/>
      <circle cx="562" cy="259" r="11" fill="#fbbf24"/>
      <rect x="582" y="250" width="90" height="7" rx="3.5" fill="#334155"/><rect x="582" y="264" width="40" height="6" rx="3" fill="#94a3b8"/>
      <rect x="698" y="255" width="18" height="8" rx="4" fill="#d97706"/>
    </g>

    <!-- live nutrition ring -->
    <g>
      <circle cx="576" cy="336" r="30" fill="none" stroke="#fef3c7" stroke-width="9"/>
      <circle cx="576" cy="336" r="30" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="134 189" transform="rotate(-90 576 336)"/>
      <circle cx="576" cy="336" r="17" fill="#fffbeb"/>
    </g>
    <rect x="624" y="318" width="86" height="8" rx="4" fill="#334155"/>
    <rect x="624" y="334" width="62" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="624" y="350" width="74" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>
</svg>
