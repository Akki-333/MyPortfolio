      <rect x="188" y="9" width="62" height="6" rx="3" fill="#0369a1"/>

      <rect x="178" y="30" width="82" height="24" rx="6" fill="#0284c7"/>
      <rect x="188" y="39" width="62" height="6" rx="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
