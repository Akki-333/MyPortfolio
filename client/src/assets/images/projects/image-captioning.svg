    <rect x="66" y="110" width="34" height="12" rx="3" fill="#7c3aed"/>

    <rect x="48" y="196" width="150" height="112" rx="11" fill="url(#ic-sky)" stroke="#c4b5fd" stroke-width="2.5"/>
    <circle cx="80" cy="224" r="12" fill="#c026d3"/>
    <path d="M48 284 L86 248 L116 276 L146 244 L198 292 L198 297 A11 11 0 0 1 187 308 L59 308 A11 11 0 0 1 48 297 Z" fill="#c026d3" opacity="0.45"/>
    <rect x="110" y="240" width="66" height="52" rx="5" fill="none" stroke="#c026d3" stroke-width="3"/>
    <rect x="110" y="230" width="42" height="12" rx="3" fill="#c026d3"/>

    <rect x="48" y="322" width="150" height="78" rx="11" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="7 6"/>
