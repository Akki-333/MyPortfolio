    <rect x="70" y="366" width="72" height="8" rx="4" fill="#f3e8ff"/>
  </g>

  <g stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 228 L282 228"/><path d="M271 219 L282 228 L271 237"/>
  </g>

  <!-- Tokeniser -->
  <g>
    <rect x="296" y="132" width="126" height="190" rx="14" fill="#7c3aed"/>
    <rect x="314" y="152" width="90" height="14" rx="7" fill="#ffffff" opacity="0.26"/>
    <rect x="314" y="176" width="66" height="14" rx="7" fill="#ffffff" opacity="0.4"/>
    <rect x="314" y="200" width="90" height="14" rx="7" fill="#ffffff" opacity="0.54"/>
    <rect x="314" y="224" width="54" height="14" rx="7" fill="#ffffff" opacity="0.68"/>
    <rect x="314" y="248" width="78" height="14" rx="7" fill="#ffffff" opacity="0.82"/>
    <rect x="314" y="272" width="40" height="14" rx="7" fill="#ffffff"/>
    <rect x="314" y="296" width="62" height="10" rx="5" fill="#ddd6fe"/>
  </g>

  <g stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 228 L502 228"/><path d="M491 219 L502 228 L491 237"/>
  </g>

  <!-- Caption records, last one unmatched and reported rather than dropped -->
  <g>
    <rect x="520" y="76" width="232" height="72" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="540" y="96" width="54" height="20" rx="10" fill="#ede9fe"/><rect x="550" y="103" width="34" height="6" rx="3" fill="#6d28d9"/>
    <rect x="602" y="96" width="72" height="20" rx="10" fill="#ede9fe"/><rect x="612" y="103" width="52" height="6" rx="3" fill="#6d28d9"/>
    <rect x="540" y="126" width="130" height="7" rx="3.5" fill="#94a3b8"/>

    <rect x="520" y="162" width="232" height="72" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="540" y="182" width="80" height="20" rx="10" fill="#fae8ff"/><rect x="550" y="189" width="60" height="6" rx="3" fill="#a21caf"/>
    <rect x="628" y="182" width="50" height="20" rx="10" fill="#fae8ff"/><rect x="638" y="189" width="30" height="6" rx="3" fill="#a21caf"/>
    <rect x="540" y="212" width="106" height="7" rx="3.5" fill="#94a3b8"/>

    <rect x="520" y="248" width="232" height="72" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="540" y="268" width="64" height="20" rx="10" fill="#ede9fe"/><rect x="550" y="275" width="44" height="6" rx="3" fill="#6d28d9"/>
    <rect x="612" y="268" width="86" height="20" rx="10" fill="#ede9fe"/><rect x="622" y="275" width="66" height="6" rx="3" fill="#6d28d9"/>
    <rect x="540" y="298" width="122" height="7" rx="3.5" fill="#94a3b8"/>

    <!-- counted, not silently discarded -->
    <rect x="520" y="334" width="232" height="66" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="546" cy="367" r="11" fill="#fef3c7"/>
    <rect x="545" y="361" width="3" height="7" rx="1.5" fill="#b45309"/><circle cx="546.5" cy="372" r="1.8" fill="#b45309"/>
    <rect x="568" y="356" width="96" height="8" rx="4" fill="#92400e"/>
    <rect x="568" y="372" width="140" height="7" rx="3.5" fill="#d6bfa0"/>
  </g>
</svg>
