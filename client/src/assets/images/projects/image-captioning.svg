<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Annotated image tiles with bounding boxes resolving into tokenised caption records, one flagged as unmatched">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/><stop offset="55%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="ic-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ic-bg)"/>

  <!-- Annotated image tiles -->
  <g>
    <rect x="48" y="70" width="150" height="112" rx="11" fill="url(#ic-sky)" stroke="#c4b5fd" stroke-width="2.5"/>
    <circle cx="166" cy="98" r="13" fill="#f59e0b"/>
    <path d="M48 158 L88 118 L118 148 L146 122 L198 168 L198 171 A11 11 0 0 1 187 182 L59 182 A11 11 0 0 1 48 171 Z" fill="#7c3aed" opacity="0.55"/>
