<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Document chunks feeding a vector index and a knowledge graph, converging on an answer card that carries a citation">
  <defs>
    <linearGradient id="am-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/><stop offset="55%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="am-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#am-bg)"/>
  <g fill="#c7d2fe" opacity="0.55">
    <circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/><circle cx="200" cy="40" r="1.6"/><circle cx="280" cy="40" r="1.6"/>
    <circle cx="40" cy="410" r="1.6"/><circle cx="120" cy="410" r="1.6"/><circle cx="200" cy="410" r="1.6"/><circle cx="280" cy="410" r="1.6"/>
    <circle cx="600" cy="40" r="1.6"/><circle cx="680" cy="40" r="1.6"/><circle cx="760" cy="40" r="1.6"/>
  </g>

  <!-- Source document, chunked -->
  <g>
    <rect x="40" y="96" width="118" height="150" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="56" y="114" width="86" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="56" y="128" width="64" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="52" y="146" width="94" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="52" y="182" width="94" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="52" y="218" width="94" height="18" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>

  <!-- Vector index -->
  <g>
    <rect x="40" y="272" width="118" height="106" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <g fill="#06b6d4">
      <rect x="56" y="290" width="20" height="20" rx="4"/><rect x="82" y="290" width="20" height="20" rx="4" opacity="0.62"/><rect x="108" y="290" width="20" height="20" rx="4" opacity="0.34"/>
      <rect x="56" y="316" width="20" height="20" rx="4" opacity="0.5"/><rect x="82" y="316" width="20" height="20" rx="4"/><rect x="108" y="316" width="20" height="20" rx="4" opacity="0.72"/>
      <rect x="56" y="342" width="20" height="20" rx="4" opacity="0.28"/><rect x="82" y="342" width="20" height="20" rx="4" opacity="0.46"/><rect x="108" y="342" width="20" height="20" rx="4" opacity="0.86"/>
    </g>
  </g>

  <g stroke="#a5b4fc" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M164 190 L214 200"/><path d="M164 322 L214 292"/>
  </g>

  <!-- Knowledge graph: the retrieved path is solid indigo, the rest is quiet -->
  <g stroke="#c7d2fe" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 300 L262 214 M420 118 L520 106 M520 106 L556 194 M300 300 L338 384 M556 194 L604 288"/>
  </g>
  <g stroke="#4f46e5" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M262 214 L420 118 M262 214 L358 268 M358 268 L556 194"/>
  </g>

  <g fill="url(#am-node)">
    <circle cx="262" cy="214" r="22"/><circle cx="420" cy="118" r="17"/><circle cx="358" cy="268" r="19"/><circle cx="556" cy="194" r="17"/>
  </g>
  <g fill="#ffffff" stroke="#c7d2fe" stroke-width="3">
    <circle cx="300" cy="300" r="13"/><circle cx="520" cy="106" r="13"/><circle cx="338" cy="384" r="13"/><circle cx="604" cy="288" r="13"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="262" cy="214" r="7"/><circle cx="358" cy="268" r="6"/>
  </g>

  <!-- Answer card with citation -->
  <g>
    <rect x="608" y="118" width="156" height="128" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="2.5"/>
    <rect x="626" y="140" width="70" height="9" rx="4.5" fill="#4338ca"/>
    <rect x="626" y="162" width="120" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="626" y="178" width="104" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="626" y="194" width="116" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="626" y="214" width="82" height="20" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="638" cy="224" r="4" fill="#06b6d4"/>
    <rect x="648" y="220" width="48" height="7" rx="3.5" fill="#0e7490"/>
  </g>
  <g stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M578 186 L600 182"/><path d="M590 176 L600 182 L592 190"/>
  </g>
</svg>
